<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Delay Controller</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { --bg: #0f1115; --card: #181b20; --accent: #9146FF; --kick: #53FC18; --text: #efeff1; --muted: #848494; }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 14px; display: flex; flex-direction: column; gap: 12px; max-width: 520px; margin-inline: auto; }
    
    #splash {
      position: fixed; inset: 0; background: rgba(9, 10, 15, 0.97); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 999; text-align: center; padding: 24px; transition: opacity 0.4s ease;
    }
    #splash h1 { font-size: 26px; margin: 0 0 10px 0; }
    #splash p { color: var(--muted); margin: 0 0 24px 0; max-width: 380px; font-size: 14px; }
    .btn-enter {
      background: linear-gradient(135deg, var(--accent), #6441a5); color: #fff; border: none;
      padding: 16px 34px; font-size: 16px; font-weight: 700; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 25px rgba(145, 70, 255, 0.5); transition: transform 0.2s;
    }
    .btn-enter:hover { transform: scale(1.05); }

    .card { background: var(--card); border-radius: 10px; padding: 14px; border: 1px solid #262930; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: #2c2f36; color: var(--muted); }
    .badge.on { background: rgba(83, 252, 24, 0.15); color: var(--kick); border: 1px solid var(--kick); }
    .delay-display { font-size: 42px; font-weight: 800; text-align: center; margin: 8px 0; color: #fff; }
    .delay-display span { font-size: 18px; color: var(--muted); }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; margin: 10px 0; }
    .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
    button { background: #262930; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.15s; }
    button:hover { background: #343842; }
    .btn-live { width: 100%; padding: 12px; font-size: 14px; background: var(--accent); margin-top: 8px; }
    .btn-live.stop { background: #e91916; }
    .btn-github {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      background: #21262d; color: #f0f6fc; border: 1px solid #30363d; text-decoration: none;
      padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13px; margin-top: 8px;
    }
    .btn-github:hover { background: #30363d; }
    input[type="text"], input[type="password"] { width: 100%; background: #0f1115; border: 1px solid #2c2f36; color: #fff; padding: 8px; border-radius: 6px; margin-top: 4px; margin-bottom: 8px; font-size: 12px; }
    label { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
    .stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px solid #262930; }
    .preview-box { width: 100%; border-radius: 6px; margin-top: 8px; background: #000; aspect-ratio: 16 / 9; object-fit: contain; display: block; }
  </style>
</head>
<body>

  <div id="splash">
    <h1>⚡ Live Delay Controller</h1>
    <p>Clique abaixo para carregar o player, conectar ao painel e testar o delay ao vivo.</p>
    <button class="btn-enter" onclick="iniciarTudo()">▶ ENTRAR NO PAINEL</button>
  </div>

  <!-- Player oficial do Spotify -->
  <div id="spotifyContainer">
    <iframe 
      style="border-radius:12px" 
      src="https://open.spotify.com/embed/track/48j4dQwGw862wo654ng0PZ?utm_source=generator&theme=0" 
      width="100%" 
      height="80" 
      frameBorder="0" 
      allowfullscreen="" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
      loading="lazy">
    </iframe>
  </div>

  <div class="card">
    <div class="header">
      <span style="font-weight: 700; font-size: 14px;">⚡ DELAY AO VIVO</span>
      <div>
        <span id="obsBadge" class="badge">OBS OFF</span>
        <span id="liveBadge" class="badge">SAÍDA OFF</span>
      </div>
    </div>

    <div class="delay-display" id="delayVal">0<span>s</span></div>
    <input type="range" id="delaySlider" min="0" max="120" step="5" value="0">
    
    <div class="presets">
      <button onclick="setDelay(0)">0s (Real)</button>
      <button onclick="setDelay(15)">15s</button>
      <button onclick="setDelay(30)">30s</button>
      <button onclick="setDelay(60)">60s</button>
    </div>

    <div class="stats">
      <span>Buffer RAM: <strong id="ramStat" style="color:#fff">0.00 MB</strong></span>
      <span>Pacotes: <strong id="pktStat" style="color:#fff">0</strong></span>
    </div>

    <a href="https://github.com/login?return_to=https%3A%2F%2Fcodespaces.new%2FJotazx87%2Fdelayed" target="_blank" class="btn-github">
      🐙 Logar no GitHub & Rodar no meu Codespace
    </a>
  </div>

  <div class="card">
    <label>Preview do Sinal Atrasado (Ao Vivo)</label>
    <img id="previewImg" class="preview-box" alt="Aguardando transmissão...">
  </div>

  <div class="card">
    <label>Twitch Stream Key (Opcional)</label>
    <input type="password" id="twitchKey" placeholder="live_xxxxxxxxx">
    <label>Kick Stream URL (Opcional)</label>
    <input type="text" id="kickUrl" placeholder="rtmps://fa723fc1b171.global-contribute.live-video.net/app">
    <label>Kick Stream Key (Opcional)</label>
    <input type="password" id="kickKey" placeholder="sk_us-west-xxxxxxxx">
    <button onclick="saveKeys()" style="width: 100%; background: #2c2f36;">💾 Salvar Chaves</button>
    <button id="toggleBtn" class="btn-live" onclick="toggleStream()">▶ INICIAR TRANSMISSÃO</button>
  </div>

  <script>
    const socket = io();
    let isLive = false;

    window.addEventListener('load', () => {
      document.getElementById('previewImg').src = '/preview.mjpg?' + Date.now();
    });

    function iniciarTudo() {
      const splash = document.getElementById('splash');
      splash.style.opacity = '0';
      setTimeout(() => splash.remove(), 400);
    }

    const slider = document.getElementById('delaySlider');
    const delayVal = document.getElementById('delayVal');
    slider.addEventListener('input', (e) => { delayVal.innerHTML = `${e.target.value}<span>s</span>`; });
    slider.addEventListener('change', (e) => { setDelay(e.target.value); });

    function setDelay(sec) {
      slider.value = sec;
      delayVal.innerHTML = `${sec}<span>s</span>`;
      socket.emit('updateDelay', sec);
    }

    function saveKeys() {
      socket.emit('saveKeys', {
        twitchKey: document.getElementById('twitchKey').value,
        kickUrl: document.getElementById('kickUrl').value,
        kickKey: document.getElementById('kickKey').value
      });
      alert('Chaves salvas!');
    }

    function toggleStream() {
      socket.emit('toggleStream', isLive ? 'stop' : 'start');
      if (!isLive) {
        setTimeout(() => {
          document.getElementById('previewImg').src = '/preview.mjpg?' + Date.now();
        }, 800);
      }
    }

    socket.on('status', (cfg) => {
      isLive = cfg.isLiveOut;
      document.getElementById('obsBadge').className = cfg.obsConnected ? 'badge on' : 'badge';
      document.getElementById('obsBadge').innerText = cfg.obsConnected ? 'OBS ON' : 'OBS OFF';
      document.getElementById('liveBadge').className = cfg.isLiveOut ? 'badge on' : 'badge';
      document.getElementById('liveBadge').innerText = cfg.isLiveOut ? 'NO AR' : 'SAÍDA OFF';
      const btn = document.getElementById('toggleBtn');
      btn.innerText = cfg.isLiveOut ? '⏹ PARAR TRANSMISSÃO' : '▶ INICIAR TRANSMISSÃO';
      btn.className = cfg.isLiveOut ? 'btn-live stop' : 'btn-live';
    });

    socket.on('telemetry', (data) => {
      document.getElementById('ramStat').innerText = `${data.bufferMB} MB`;
      document.getElementById('pktStat').innerText = data.queuePackets;
    });
  </script>
</body>
</html>
